services:
  salin-site:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 替换为你的实际域名
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3300}
    image: salin-site:latest
    container_name: salin-site
    restart: unless-stopped
    ports:
      - "${PORT:-3300}:3300"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3300}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3300/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
